<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledger · THE BRAIN</title>
  <meta name="description" content="A personal ledger — track income and expenses with a running balance." />

  <!-- Browser-tab icon: 📒 as an inline SVG (no extra file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>" />

  <!-- Match mobile browser chrome to the page -->
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />

  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8eaed;
      --muted: #9aa0ac;
      --accent: #6ea8fe;
      --border: #262b36;
      --pos: #4ec98f;
      --neg: #f0736f;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1a1c20;
        --muted: #5c6270;
        --accent: #2f6fed;
        --border: #e3e6eb;
        --pos: #1f9d63;
        --neg: #d64541;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 40px 20px 64px;
      min-height: 100vh;
    }
    .wrap { width: 100%; max-width: 680px; }

    .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: .9rem; margin-bottom: 18px; }
    .back:hover { color: var(--accent); }

    header { text-align: center; margin-bottom: 26px; }
    .avatar {
      width: 72px; height: 72px; border-radius: 18px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, var(--accent), #a06eff);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); margin: 0; font-size: .95rem; }

    /* Summary tiles */
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
    .tile {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; text-align: center;
    }
    .tile .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    .tile .value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; word-break: break-word; }
    .value.pos { color: var(--pos); }
    .value.neg { color: var(--neg); }

    /* Add form */
    form.add {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 22px;
      display: grid; gap: 10px;
      grid-template-columns: 1fr 1fr;
    }
    form.add .desc { grid-column: 1 / -1; }
    form.add .row-btns { grid-column: 1 / -1; display: flex; gap: 10px; }
    label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 5px; }
    input, select {
      width: 100%; padding: 10px 12px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      font: inherit; font-size: .95rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button {
      font: inherit; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 16px; background: var(--accent); color: #fff; border-color: transparent;
      transition: transform .1s ease, opacity .1s ease;
    }
    button:hover { transform: translateY(-1px); }
    button.ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    button.ghost:hover { color: var(--text); border-color: var(--accent); }
    .seg { display: flex; gap: 8px; }
    .seg button {
      flex: 1; background: var(--bg); color: var(--muted); border: 1px solid var(--border); font-weight: 600;
    }
    .seg button[aria-pressed="true"][data-type="income"] { background: var(--pos); color: #fff; border-color: transparent; }
    .seg button[aria-pressed="true"][data-type="expense"] { background: var(--neg); color: #fff; border-color: transparent; }

    /* Ledger list */
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .entry {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .entry .meta { flex: 1; min-width: 0; }
    .entry .d { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry .date { color: var(--muted); font-size: .78rem; }
    .entry .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .entry .amt.pos { color: var(--pos); }
    .entry .amt.neg { color: var(--neg); }
    .entry .del {
      background: transparent; border: none; color: var(--muted); font-size: 1.1rem;
      padding: 4px 6px; cursor: pointer; line-height: 1; border-radius: 8px;
    }
    .entry .del:hover { color: var(--neg); transform: none; }

    .empty { text-align: center; color: var(--muted); padding: 32px 12px; font-size: .95rem; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 12px; }
    .toolbar h2 { font-size: 1rem; margin: 0; }

    footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 40px; }
    footer a { color: var(--muted); }

    @media (max-width: 480px) {
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">← THE BRAIN</a>

    <header>
      <div class="avatar">📒</div>
      <h1>Ledger</h1>
      <p class="tagline">Track income and expenses. Saved locally in your browser.</p>
    </header>

    <section class="summary" aria-label="Balance summary">
      <div class="tile">
        <div class="label">Balance</div>
        <div class="value" id="sum-balance">$0.00</div>
      </div>
      <div class="tile">
        <div class="label">Income</div>
        <div class="value pos" id="sum-income">$0.00</div>
      </div>
      <div class="tile">
        <div class="label">Expenses</div>
        <div class="value neg" id="sum-expense">$0.00</div>
      </div>
    </section>

    <form class="add" id="add-form" autocomplete="off">
      <div class="desc">
        <label for="f-desc">Description</label>
        <input type="text" id="f-desc" placeholder="e.g. Groceries" required maxlength="80" />
      </div>
      <div>
        <label for="f-amount">Amount</label>
        <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0" required />
      </div>
      <div>
        <label for="f-date">Date</label>
        <input type="date" id="f-date" required />
      </div>
      <div class="desc">
        <label>Type</label>
        <div class="seg" role="group" aria-label="Entry type">
          <button type="button" data-type="income" aria-pressed="false">Income</button>
          <button type="button" data-type="expense" aria-pressed="true">Expense</button>
        </div>
      </div>
      <div class="row-btns">
        <button type="submit">Add entry</button>
      </div>
    </form>

    <div class="toolbar">
      <h2>Entries</h2>
      <button type="button" class="ghost" id="clear-all">Clear all</button>
    </div>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>No entries yet. Add one above to get started.</p>

    <footer>
      Part of <a href="index.html">THE BRAIN</a> · data stays on this device
    </footer>
  </main>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "the-brain-ledger-v1";
      var entries = load();
      var pendingType = "expense";

      var els = {
        form: document.getElementById("add-form"),
        desc: document.getElementById("f-desc"),
        amount: document.getElementById("f-amount"),
        date: document.getElementById("f-date"),
        list: document.getElementById("list"),
        empty: document.getElementById("empty"),
        clearAll: document.getElementById("clear-all"),
        sumBalance: document.getElementById("sum-balance"),
        sumIncome: document.getElementById("sum-income"),
        sumExpense: document.getElementById("sum-expense"),
        seg: document.querySelectorAll(".seg button")
      };

      // Default the date field to today.
      els.date.value = todayISO();

      // Type toggle.
      els.seg.forEach(function (btn) {
        btn.addEventListener("click", function () {
          pendingType = btn.getAttribute("data-type");
          els.seg.forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
        });
      });

      els.form.addEventListener("submit", function (e) {
        e.preventDefault();
        var amount = parseFloat(els.amount.value);
        var desc = els.desc.value.trim();
        if (!desc || isNaN(amount) || amount <= 0) return;

        entries.push({
          id: uid(),
          desc: desc,
          amount: Math.round(amount * 100) / 100,
          type: pendingType,
          date: els.date.value || todayISO()
        });
        save();
        render();

        // Reset for the next entry, keep the chosen date.
        els.desc.value = "";
        els.amount.value = "";
        els.desc.focus();
      });

      els.list.addEventListener("click", function (e) {
        var btn = e.target.closest(".del");
        if (!btn) return;
        var id = btn.getAttribute("data-id");
        entries = entries.filter(function (x) { return x.id !== id; });
        save();
        render();
      });

      els.clearAll.addEventListener("click", function () {
        if (!entries.length) return;
        if (!confirm("Delete all ledger entries? This can't be undone.")) return;
        entries = [];
        save();
        render();
      });

      function render() {
        // Sort newest date first; stable for equal dates.
        var sorted = entries.slice().sort(function (a, b) {
          return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
        });

        els.list.innerHTML = "";
        sorted.forEach(function (x) {
          var li = document.createElement("li");
          li.className = "entry";

          var meta = document.createElement("div");
          meta.className = "meta";
          var d = document.createElement("div");
          d.className = "d";
          d.textContent = x.desc;
          var date = document.createElement("div");
          date.className = "date";
          date.textContent = formatDate(x.date);
          meta.appendChild(d);
          meta.appendChild(date);

          var amt = document.createElement("div");
          amt.className = "amt " + (x.type === "income" ? "pos" : "neg");
          amt.textContent = (x.type === "income" ? "+" : "−") + money(x.amount);

          var del = document.createElement("button");
          del.className = "del";
          del.setAttribute("data-id", x.id);
          del.setAttribute("aria-label", "Delete entry");
          del.textContent = "✕";

          li.appendChild(meta);
          li.appendChild(amt);
          li.appendChild(del);
          els.list.appendChild(li);
        });

        els.empty.hidden = entries.length > 0;

        var income = 0, expense = 0;
        entries.forEach(function (x) {
          if (x.type === "income") income += x.amount;
          else expense += x.amount;
        });
        var balance = income - expense;

        els.sumIncome.textContent = money(income);
        els.sumExpense.textContent = money(expense);
        els.sumBalance.textContent = (balance < 0 ? "−" : "") + money(Math.abs(balance));
        els.sumBalance.className = "value " + (balance > 0 ? "pos" : balance < 0 ? "neg" : "");
      }

      function money(n) {
        return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatDate(iso) {
        var parts = (iso || "").split("-");
        if (parts.length !== 3) return iso || "";
        var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function todayISO() {
        var d = new Date();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          var data = JSON.parse(raw);
          return Array.isArray(data) ? data : [];
        } catch (err) {
          return [];
        }
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        } catch (err) {
          /* storage unavailable — keep working in-memory */
        }
      }

      render();
    })();
  </script>
</body>
</html>
