<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE BRAIN</title>
  <meta name="description" content="THE BRAIN — a personal links hub." />

  <!-- Browser-tab icon: 🧠 as an inline SVG (no extra file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>" />

  <!-- Match mobile browser chrome to the page -->
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />

  <!-- Social share preview (Open Graph + Twitter) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="THE BRAIN" />
  <meta property="og:description" content="A personal hub — a few places to find me and my work." />
  <meta property="og:url" content="https://meshman14-ux.github.io/THE-BRAIN/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="THE BRAIN" />
  <meta name="twitter:description" content="A personal hub — a few places to find me and my work." />
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8eaed;
      --muted: #9aa0ac;
      --accent: #6ea8fe;
      --border: #262b36;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1a1c20;
        --muted: #5c6270;
        --accent: #2f6fed;
        --border: #e3e6eb;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 48px 20px 64px;
      min-height: 100vh;
    }
    .wrap { width: 100%; max-width: 560px; }
    header { text-align: center; margin-bottom: 32px; }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent), #a06eff);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; color: #fff;
      letter-spacing: -1px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); margin: 0; font-size: 1rem; }
    .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .links a {
      display: flex; align-items: center; gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .links a:hover { transform: translateY(-2px); border-color: var(--accent); }
    .links .ico {
      width: 24px; text-align: center; font-size: 20px; flex: 0 0 24px;
    }
    .links .sub { display: block; font-weight: 400; font-size: .82rem; color: var(--muted); }
    .links .txt { display: flex; flex-direction: column; }
    footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 40px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="avatar">🧠</div>
      <h1>THE BRAIN</h1>
      <p class="tagline">A personal hub — a few places to find me and my work.</p>
    </header>

    <!-- Edit the href and label of each link. Add or remove <li> blocks freely. -->
    <ul class="links">
      <li>
        <a href="https://github.com/meshman14-ux" target="_blank" rel="noopener">
          <span class="ico">🐙</span>
          <span class="txt">GitHub<span class="sub">github.com/meshman14-ux</span></span>
        </a>
      </li>
      <li>
        <a href="#" >
          <span class="ico">✉️</span>
          <span class="txt">Email<span class="sub">Add your email link (mailto:you@example.com)</span></span>
        </a>
      </li>
      <li>
        <a href="#">
          <span class="ico">💼</span>
          <span class="txt">LinkedIn<span class="sub">Add your profile URL</span></span>
        </a>
      </li>
      <li>
        <a href="ledger.html">
          <span class="ico">📒</span>
          <span class="txt">Cole "Ledger" Vaughn<span class="sub">The fixer who got out clean — a character</span></span>
        </a>
      </li>
    </ul>

    <footer>
      Built with GitHub Pages · <a href="https://github.com/meshman14-ux/THE-BRAIN">source</a>
    </footer>
  </main>
</body>
</html>
