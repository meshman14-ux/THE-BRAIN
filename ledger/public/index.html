<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledger — talk to Agatha</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="who">
        <div class="avatar">AV</div>
        <div class="meta">
          <h1>Agatha "Ledger" Vane</h1>
          <p>Shieldmaiden's calm, strategist's mind. Ask her something.</p>
        </div>
      </div>
      <button id="reset" class="reset" title="Start over">clear</button>
    </header>

    <section id="thread" class="thread" aria-live="polite">
      <div class="msg ledger">
        <div class="bubble">Sit. Tell me what's on your mind, love.</div>
      </div>
    </section>

    <form id="composer" class="composer">
      <input
        id="input"
        class="input"
        type="text"
        autocomplete="off"
        placeholder="Tell Agatha what's going on…"
        aria-label="Message"
      />
      <button id="send" class="send" type="submit">Send</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
