name: Deploy to GitHub Pages

# Builds THE BRAIN (the second-brain PWA in app/) and publishes it as the
# site root, with the older static pages kept reachable underneath:
#   /THE-BRAIN/                   -> THE BRAIN app
#   /THE-BRAIN/legacy/            -> the links hub
#   /THE-BRAIN/legacy/ledger.html -> the Ledger AI character chat
# Runs on every push to main.
#
# Pages must be set to "GitHub Actions" as its source (Settings → Pages),
# not "Deploy from a branch" — otherwise this runs green and the live site
# never changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test THE BRAIN
        working-directory: app
        run: |
          npm ci
          npm test

      - name: Build THE BRAIN
        working-directory: app
        run: npm run build

      # The app is the site root; the hand-written pages that used to be the
      # site keep working under /legacy/ so nothing that was live 404s.
      - name: Assemble the site
        run: |
          mkdir -p _site/legacy
          cp -r app/dist/* _site/
          cp index.html _site/legacy/index.html
          cp ledger.html _site/legacy/ledger.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
