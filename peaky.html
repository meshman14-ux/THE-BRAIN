<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peaky Blinder Advisor · THE BRAIN</title>
  <meta name="description" content="The Peaky Blinder Advisor — blunt, strategic counsel from a 1920s Birmingham operator." />

  <!-- Browser-tab icon: 🎩 as an inline SVG (no extra file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎩</text></svg>" />

  <!-- Match mobile browser chrome to the page -->
  <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />

  <style>
    :root {
      --bg: #12100c;
      --card: #1c1913;
      --text: #ece7dc;
      --muted: #a89f8c;
      --accent: #c9a227;
      --accent2: #8a5a2b;
      --border: #2e2a20;
      --bubble-me: #7a5a1c;
      --bubble-them: #221e16;
      --danger: #f0736f;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f4ef;
        --card: #ffffff;
        --text: #221e16;
        --muted: #6f6858;
        --accent: #9a7412;
        --accent2: #7a4f22;
        --border: #e5e0d3;
        --bubble-me: #9a7412;
        --bubble-them: #efece3;
        --danger: #d64541;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }
    .wrap {
      width: 100%; max-width: 720px;
      display: flex; flex-direction: column;
      height: 100dvh;
      padding: 0 16px;
    }

    /* Top bar */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 2px 12px;
      border-bottom: 1px solid var(--border);
    }
    .back { color: var(--muted); text-decoration: none; font-size: 1.2rem; line-height: 1; padding: 4px; }
    .back:hover { color: var(--accent); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex: 0 0 40px;
    }
    .who { flex: 1; min-width: 0; }
    .who h1 { font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; }
    .who .status { color: var(--muted); font-size: .78rem; }
    .who .status.on { color: #c9a227; }
    .icon-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 10px; padding: 7px 10px; cursor: pointer; font: inherit; font-size: .9rem;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Settings panel */
    .settings {
      border: 1px solid var(--border); background: var(--card);
      border-radius: var(--radius); padding: 14px; margin: 12px 0 4px;
      display: none; gap: 10px; flex-direction: column;
    }
    .settings.open { display: flex; }
    .settings label { font-size: .78rem; color: var(--muted); display: block; margin-bottom: 5px; }
    .settings input, .settings select, .settings textarea {
      width: 100%; padding: 9px 11px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: .92rem;
    }
    .settings textarea { resize: vertical; min-height: 78px; line-height: 1.45; }
    .settings input:focus, .settings select:focus, .settings textarea:focus { outline: none; border-color: var(--accent); }
    .settings .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .settings .row > div { flex: 1; min-width: 150px; }
    .hint { font-size: .74rem; color: var(--muted); margin-top: 2px; }
    .hint a { color: var(--accent); }
    .settings .actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
    .btn {
      font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 9px 15px;
      background: var(--accent); color: #14110a; border: 1px solid transparent;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn.ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn.ghost:hover { color: var(--text); border-color: var(--accent); }
    .btn.danger { background: transparent; color: var(--danger); border-color: var(--border); }
    .btn.danger:hover { border-color: var(--danger); }

    /* Messages */
    .chat { flex: 1; overflow-y: auto; padding: 16px 2px; display: flex; flex-direction: column; gap: 12px; }
    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg .ava {
      width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .bubble {
      padding: 10px 14px; border-radius: 16px; max-width: 82%;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    }
    .msg.them .bubble { background: var(--bubble-them); border-top-left-radius: 5px; }
    .msg.me { justify-content: flex-end; }
    .msg.me .bubble { background: var(--bubble-me); color: #fff; border-top-right-radius: 5px; }
    .bubble .cursor { display: inline-block; width: 7px; height: 1.05em; background: var(--muted); vertical-align: -2px; border-radius: 1px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

    .empty {
      text-align: center; color: var(--muted); margin: auto; padding: 24px; max-width: 380px;
    }
    .empty .big { font-size: 42px; margin-bottom: 10px; }
    .empty h2 { color: var(--text); font-size: 1.15rem; margin: 0 0 6px; }
    .empty p { margin: 0; font-size: .92rem; }

    .error {
      background: color-mix(in srgb, var(--danger) 14%, transparent);
      border: 1px solid var(--danger); color: var(--text);
      border-radius: 12px; padding: 10px 12px; font-size: .86rem;
    }

    /* Composer */
    .composer {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 10px 0 14px; border-top: 1px solid var(--border);
    }
    .composer textarea {
      flex: 1; resize: none; max-height: 160px; min-height: 46px;
      padding: 12px 14px; background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 14px; font: inherit; font-size: .95rem; line-height: 1.4;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .send {
      width: 46px; height: 46px; flex: 0 0 46px; border-radius: 50%;
      background: var(--accent); color: #14110a; border: none; cursor: pointer;
      font-size: 20px; display: flex; align-items: center; justify-content: center;
    }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .send:not(:disabled):hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <a class="back" href="index.html" title="THE BRAIN" aria-label="Back to THE BRAIN">←</a>
      <div class="avatar">🎩</div>
      <div class="who">
        <h1>Peaky Blinder Advisor</h1>
        <div class="status" id="status">Set your API key to begin</div>
      </div>
      <button class="icon-btn" id="toggle-settings" aria-label="Settings">⚙︎</button>
    </header>

    <section class="settings" id="settings">
      <div>
        <label for="api-key">Anthropic API key</label>
        <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
        <div class="hint">Stored only in this browser (localStorage) and sent directly to api.anthropic.com. Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</div>
      </div>
      <div class="row">
        <div>
          <label for="model">Model</label>
          <select id="model">
            <option value="claude-opus-4-8">Claude Opus 4.8 (smartest)</option>
            <option value="claude-sonnet-5">Claude Sonnet 5 (balanced)</option>
            <option value="claude-haiku-4-5">Claude Haiku 4.5 (fastest)</option>
          </select>
        </div>
      </div>
      <div>
        <label for="persona">Who is the Advisor? (character / system prompt)</label>
        <textarea id="persona" spellcheck="false"></textarea>
        <div class="hint">Shape the Advisor's personality, voice, and backstory. Edit freely — saved automatically.</div>
      </div>
      <div class="actions">
        <button class="btn danger" id="clear-chat">Clear conversation</button>
        <button class="btn" id="save-settings">Save</button>
      </div>
    </section>

    <div class="chat" id="chat"></div>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="State your business…" rows="1"></textarea>
      <button type="submit" class="send" id="send" aria-label="Send" disabled>➤</button>
    </form>
  </main>

  <script>
    (function () {
      "use strict";

      var KEYS = {
        apiKey: "the-brain-peaky-apikey",
        model: "the-brain-peaky-model",
        persona: "the-brain-peaky-persona",
        history: "the-brain-peaky-history-v1"
      };

      var DEFAULT_PERSONA =
        "You are the Peaky Blinder Advisor — an original character inspired by the razor-gang " +
        "Birmingham of the 1920s: flat cap, wool overcoat, pocket watch, a mind like a chess clock.\n\n" +
        "You are a strategist and fixer. People come to you with their real problems — business, " +
        "negotiations, careers, family, rivals — and you give them blunt, practical counsel.\n\n" +
        "Voice: calm, gravelly, economical. Short sentences. You speak in a working-class Brummie " +
        "cadence, call people 'friend', and favour hard truths over comfort. You think three moves " +
        "ahead and say so. Occasionally you light a cigarette, pour a whiskey, or look out over the " +
        "canal before answering — a line of stage direction in *asterisks* now and then, never more.\n\n" +
        "Rules of the house: your advice is always legal and above board — you left the old life " +
        "behind and you tell anyone who asks for trouble to walk away from it, like a man who's seen " +
        "where it ends. You never break character.\n\n" +
        "Keep answers tight. A good plan fits on the back of a betting slip.";

      var els = {
        chat: document.getElementById("chat"),
        input: document.getElementById("input"),
        send: document.getElementById("send"),
        composer: document.getElementById("composer"),
        settings: document.getElementById("settings"),
        toggle: document.getElementById("toggle-settings"),
        apiKey: document.getElementById("api-key"),
        model: document.getElementById("model"),
        persona: document.getElementById("persona"),
        save: document.getElementById("save-settings"),
        clear: document.getElementById("clear-chat"),
        status: document.getElementById("status")
      };

      // ---- State ----
      var messages = load(KEYS.history, []);       // [{role, content}]
      var streaming = false;

      // ---- Init from storage ----
      els.apiKey.value = localStorage.getItem(KEYS.apiKey) || "";
      els.model.value = localStorage.getItem(KEYS.model) || "claude-opus-4-8";
      els.persona.value = localStorage.getItem(KEYS.persona) || DEFAULT_PERSONA;

      // ---- Settings panel ----
      els.toggle.addEventListener("click", function () {
        els.settings.classList.toggle("open");
      });
      els.save.addEventListener("click", function () {
        localStorage.setItem(KEYS.apiKey, els.apiKey.value.trim());
        localStorage.setItem(KEYS.model, els.model.value);
        localStorage.setItem(KEYS.persona, els.persona.value);
        els.settings.classList.remove("open");
        refreshStatus();
        updateSendState();
      });
      // Persist persona & model live too
      els.persona.addEventListener("input", function () {
        localStorage.setItem(KEYS.persona, els.persona.value);
      });
      els.model.addEventListener("change", function () {
        localStorage.setItem(KEYS.model, els.model.value);
      });
      els.apiKey.addEventListener("input", function () {
        localStorage.setItem(KEYS.apiKey, els.apiKey.value.trim());
        refreshStatus();
        updateSendState();
      });
      els.clear.addEventListener("click", function () {
        if (!messages.length) return;
        if (!confirm("Clear the whole conversation with the Advisor?")) return;
        messages = [];
        save(KEYS.history, messages);
        render();
      });

      // ---- Composer ----
      els.input.addEventListener("input", function () {
        autoGrow();
        updateSendState();
      });
      els.input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          els.composer.requestSubmit();
        }
      });
      els.composer.addEventListener("submit", function (e) {
        e.preventDefault();
        onSend();
      });

      function autoGrow() {
        els.input.style.height = "auto";
        els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
      }

      function hasKey() { return (localStorage.getItem(KEYS.apiKey) || "").trim().length > 0; }

      function updateSendState() {
        els.send.disabled = streaming || !hasKey() || els.input.value.trim().length === 0;
      }

      function refreshStatus() {
        if (!hasKey()) {
          els.status.textContent = "Set your API key to begin";
          els.status.className = "status";
        } else {
          els.status.textContent = "In the office · " + labelFor(els.model.value);
          els.status.className = "status on";
        }
      }
      function labelFor(m) {
        if (m === "claude-opus-4-8") return "Opus 4.8";
        if (m === "claude-sonnet-5") return "Sonnet 5";
        if (m === "claude-haiku-4-5") return "Haiku 4.5";
        return m;
      }

      // ---- Send flow ----
      function onSend() {
        var text = els.input.value.trim();
        if (!text || streaming || !hasKey()) return;

        messages.push({ role: "user", content: text });
        save(KEYS.history, messages);
        els.input.value = "";
        autoGrow();
        render();

        streaming = true;
        updateSendState();

        var assistant = { role: "assistant", content: "" };
        messages.push(assistant);
        render(true); // show typing cursor

        streamReply(assistant).then(function () {
          streaming = false;
          if (!assistant.content) {
            // Nothing came back — drop the empty turn so we don't persist a blank.
            messages.pop();
          }
          save(KEYS.history, messages);
          render();
          updateSendState();
          els.input.focus();
        }).catch(function (err) {
          streaming = false;
          messages.pop(); // remove the empty assistant turn
          save(KEYS.history, messages);
          render();
          showError(err && err.message ? err.message : String(err));
          updateSendState();
        });
      }

      function streamReply(assistant) {
        var apiKey = (localStorage.getItem(KEYS.apiKey) || "").trim();
        var model = localStorage.getItem(KEYS.model) || "claude-opus-4-8";
        var system = (localStorage.getItem(KEYS.persona) || DEFAULT_PERSONA).trim();

        // Send prior turns (exclude the empty assistant placeholder we just pushed).
        var apiMessages = messages
          .filter(function (m) { return m.content && m.content.length; })
          .map(function (m) { return { role: m.role, content: m.content }; });

        var body = {
          model: model,
          max_tokens: 4096,
          system: system,
          messages: apiMessages,
          stream: true
        };

        return fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify(body)
        }).then(function (res) {
          if (!res.ok) {
            return res.text().then(function (t) {
              var msg = "Request failed (" + res.status + ")";
              try { var j = JSON.parse(t); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
              if (res.status === 401) msg = "Invalid API key. Check it in settings (⚙︎).";
              throw new Error(msg);
            });
          }
          return consumeStream(res.body, assistant);
        });
      }

      function consumeStream(stream, assistant) {
        var reader = stream.getReader();
        var decoder = new TextDecoder();
        var buffer = "";

        function pump() {
          return reader.read().then(function (result) {
            if (result.done) return;
            buffer += decoder.decode(result.value, { stream: true });

            var lines = buffer.split("\n");
            buffer = lines.pop(); // keep last partial line

            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line.indexOf("data:") !== 0) continue;
              var data = line.slice(5).trim();
              if (!data || data === "[DONE]") continue;
              var evt;
              try { evt = JSON.parse(data); } catch (e) { continue; }

              if (evt.type === "content_block_delta" && evt.delta && evt.delta.type === "text_delta") {
                assistant.content += evt.delta.text;
                renderStreaming();
              } else if (evt.type === "message_delta" && evt.delta && evt.delta.stop_reason === "refusal") {
                if (!assistant.content) {
                  assistant.content = "(The Advisor declined to respond to that.)";
                  renderStreaming();
                }
              } else if (evt.type === "error") {
                throw new Error(evt.error && evt.error.message ? evt.error.message : "Stream error");
              }
            }
            return pump();
          });
        }
        return pump();
      }

      // ---- Rendering ----
      function render(withCursor) {
        els.chat.innerHTML = "";

        if (!messages.length) {
          var empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML =
            '<div class="big">🎩</div>' +
            "<h2>The Advisor will see you now</h2>" +
            "<p>" + (hasKey()
              ? "Blunt, strategic counsel from a 1920s Birmingham operator. State your business."
              : "Add your Anthropic API key in settings (⚙︎) to open the office.") +
            "</p>";
          els.chat.appendChild(empty);
          return;
        }

        messages.forEach(function (m, idx) {
          var last = idx === messages.length - 1;
          els.chat.appendChild(bubble(m, withCursor && last && m.role === "assistant"));
        });
        scrollToBottom();
      }

      function renderStreaming() {
        // Update only the last bubble's text for smoothness.
        var last = els.chat.querySelector(".msg:last-child .bubble");
        var assistant = messages[messages.length - 1];
        if (last && assistant) {
          last.textContent = assistant.content;
          var cur = document.createElement("span");
          cur.className = "cursor";
          last.appendChild(cur);
          scrollToBottom();
        } else {
          render(true);
        }
      }

      function bubble(m, cursor) {
        var wrap = document.createElement("div");
        wrap.className = "msg " + (m.role === "user" ? "me" : "them");
        if (m.role === "assistant") {
          var ava = document.createElement("div");
          ava.className = "ava";
          ava.textContent = "🎩";
          wrap.appendChild(ava);
        }
        var b = document.createElement("div");
        b.className = "bubble";
        b.textContent = m.content;
        if (cursor) {
          var c = document.createElement("span");
          c.className = "cursor";
          b.appendChild(c);
        }
        wrap.appendChild(b);
        return wrap;
      }

      function showError(text) {
        var e = document.createElement("div");
        e.className = "error";
        e.textContent = "⚠ " + text;
        els.chat.appendChild(e);
        scrollToBottom();
      }

      function scrollToBottom() {
        els.chat.scrollTop = els.chat.scrollHeight;
      }

      // ---- Storage helpers ----
      function load(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fallback;
          var v = JSON.parse(raw);
          return v == null ? fallback : v;
        } catch (e) { return fallback; }
      }
      function save(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      }

      // ---- Boot ----
      refreshStatus();
      updateSendState();
      render();
    })();
  </script>
</body>
</html>
