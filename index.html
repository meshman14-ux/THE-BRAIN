<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jay · Hub</title>
  <meta name="description" content="Jay's personal links hub." />
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8eaed;
      --muted: #9aa0ac;
      --accent: #6ea8fe;
      --border: #262b36;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1a1c20;
        --muted: #5c6270;
        --accent: #2f6fed;
        --border: #e3e6eb;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 48px 20px 64px;
      min-height: 100vh;
    }
    .wrap { width: 100%; max-width: 560px; }
    header { text-align: center; margin-bottom: 32px; }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent), #a06eff);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; color: #fff;
      letter-spacing: -1px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); margin: 0; font-size: 1rem; }
    .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .links a {
      display: flex; align-items: center; gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .links a:hover { transform: translateY(-2px); border-color: var(--accent); }
    .links .ico {
      width: 24px; text-align: center; font-size: 20px; flex: 0 0 24px;
    }
    .links .sub { display: block; font-weight: 400; font-size: .82rem; color: var(--muted); }
    .links .txt { display: flex; flex-direction: column; }
    footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 40px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="avatar">J</div>
      <h1>Jay</h1>
      <p class="tagline">Welcome to my hub — a few places to find me and my work.</p>
    </header>

    <!-- Edit the href and label of each link. Add or remove <li> blocks freely. -->
    <ul class="links">
      <li>
        <a href="https://github.com/meshman14-ux" target="_blank" rel="noopener">
          <span class="ico">🐙</span>
          <span class="txt">GitHub<span class="sub">github.com/meshman14-ux</span></span>
        </a>
      </li>
      <li>
        <a href="#" >
          <span class="ico">✉️</span>
          <span class="txt">Email<span class="sub">Add your email link (mailto:you@example.com)</span></span>
        </a>
      </li>
      <li>
        <a href="#">
          <span class="ico">💼</span>
          <span class="txt">LinkedIn<span class="sub">Add your profile URL</span></span>
        </a>
      </li>
      <li>
        <a href="#">
          <span class="ico">🔗</span>
          <span class="txt">Another link<span class="sub">Swap this for anything you like</span></span>
        </a>
      </li>
    </ul>

    <footer>
      Built with GitHub Pages · <a href="https://github.com/meshman14-ux/JAY_CLAUDE_HUB">source</a>
    </footer>
  </main>
</body>
</html>
