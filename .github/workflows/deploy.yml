name: Deploy to GitHub Pages

# Builds THE BRAIN (the second-brain PWA in app/) and publishes it as the
# site root, with the legacy OPSDECK prototype kept reachable underneath:
#   /THE-BRAIN/            -> THE BRAIN app
#   /THE-BRAIN/legacy/     -> the old links hub
#   /THE-BRAIN/legacy/ops/ -> the built OPSDECK prototype
# Runs on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test THE BRAIN
        working-directory: app
        run: |
          npm ci
          npm test

      - name: Build THE BRAIN
        working-directory: app
        run: npm run build

      - name: Build the legacy OPSDECK prototype
        working-directory: ops
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/legacy
          cp -r app/dist/* _site/
          cp index.html _site/legacy/index.html
          cp -r ops/dist _site/legacy/ops

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
